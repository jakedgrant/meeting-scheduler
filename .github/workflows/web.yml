name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-availability-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Check the generated database types match the migrations
        run: npm run check:database-types
      - name: Run every web suite without a server
        run: npm run test:web
      - run: npm --prefix apps/web run check
      - run: npm --prefix apps/web run build -- --configLoader runner
