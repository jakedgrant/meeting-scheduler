name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-availability-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Test guest, member, draft, lifecycle and paged-read flows without a server
        run: node --test tests/web-guest-capability.test.mjs tests/web-availability.test.mjs tests/web-creation.test.mjs tests/web-session-lifecycle.test.mjs tests/web-paged-reads.test.mjs
      - run: npm --prefix apps/web run check
      - run: npm --prefix apps/web run build -- --configLoader runner
