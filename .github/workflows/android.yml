name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-and-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      # The job builds against a placeholder google-services.json, so it must never
      # contact Firebase. This disables the Crashlytics R8 mapping upload.
      ORG_GRADLE_PROJECT_disableCrashlyticsMappingUpload: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle*
            apps/android/app/*.gradle*
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK platform 36 and build-tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: Write placeholder google-services.json (CI only, not a Firebase config)
        run: |
          test ! -e app/google-services.json
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder-not-a-real-project",
              "storage_bucket": "ci-placeholder-not-a-real-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.meetingscheduler.android" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI-PLACEHOLDER-NOT-A-REAL-KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.meetingscheduler.android.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI-PLACEHOLDER-NOT-A-REAL-KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Debug build and unit tests
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | tee "$RUNNER_TEMP/debug-certs.txt"
          grep -q "CN=Android Debug" "$RUNNER_TEMP/debug-certs.txt"

      - name: Release without signing inputs fails clearly
        run: |
          unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          log="$RUNNER_TEMP/release-missing-signing.log"
          set +e
          ./gradlew --no-daemon :app:assembleRelease > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error::assembleRelease succeeded without signing inputs"
            exit 1
          fi
          grep -q "Execution failed for task ':app:validateReleaseSigning'" "$log"
          grep -q "Release signing is not configured" "$log"
          for input in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            grep -q "$input is not set" "$log"
          done
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "::error::a release APK was produced without signing inputs"
            exit 1
          fi

      - name: Release signed with a throwaway keystore has that certificate
        run: |
          keystore="$RUNNER_TEMP/f26-ci-throwaway.p12"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
            -alias f26-ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=F26 CI Throwaway, O=meeting-scheduler CI"
          expected="$(keytool -list -v -keystore "$keystore" -storetype PKCS12 \
            -storepass "$password" -alias f26-ci \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$expected"

          KEYSTORE_FILE="$keystore" KEYSTORE_PASSWORD="$password" KEY_ALIAS=f26-ci \
            KEY_PASSWORD="$password" ./gradlew --no-daemon :app:assembleRelease

          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/release-certs.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/release-certs.txt")"
          echo "expected SHA-256: $expected"
          echo "actual SHA-256:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::release APK is not signed with the configured keystore"
            exit 1
          fi
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/release-certs.txt"; then
            echo "::error::release APK is debug-signed"
            exit 1
          fi
          rm -f "$keystore"

      - name: Unsigned release only with the explicit opt-in
        run: |
          unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          rm -rf app/build/outputs/apk/release
          log="$RUNNER_TEMP/release-unsigned.log"
          ./gradlew --no-daemon -PallowUnsignedRelease=true :app:assembleRelease 2>&1 | tee "$log"
          grep -q "building an UNSIGNED release" "$log"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$unsigned"
          test ! -e app/build/outputs/apk/release/app-release.apk
          if apksigner verify "$unsigned"; then
            echo "::error::the opt-in unsigned APK unexpectedly verifies"
            exit 1
          fi
