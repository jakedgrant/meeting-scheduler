name: Calendar security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calendar-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.3
      - name: Install locked database test runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay migrations and verify database privileges
        run: npm run test:calendar:db
      - name: Type-check calendar entry points
        run: >-
          deno check --frozen --config supabase/functions/deno.json
          supabase/functions/calendar-connection/index.ts
          supabase/functions/check-calendar-conflicts/index.ts
          supabase/functions/calendar-oauth-callback/index.ts
          supabase/functions/calendar-maintenance/index.ts
          supabase/functions/store-calendar-token/index.ts
      - name: Verify calendar security behavior without network or environment access
        run: npm run test:calendar:edge
