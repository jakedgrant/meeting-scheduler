name: Architecture database regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authorization-and-command-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay every focused database suite present on this branch
        run: node scripts/test-database.mjs
