name: iOS package regressions

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-config/date-time-fixtures.json'
      - 'packages/shared-config/entitlements.json'
      - '.github/workflows/ios-package-regressions.yml'
      - 'scripts/ci/ios-package-regressions.sh'
      - 'scripts/ci/check-ios-environment-keys.sh'
      - 'scripts/ci/ios-app-launch.sh'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-config/date-time-fixtures.json'
      - 'packages/shared-config/entitlements.json'
      - '.github/workflows/ios-package-regressions.yml'
      - 'scripts/ci/ios-package-regressions.sh'
      - 'scripts/ci/check-ios-environment-keys.sh'
      - 'scripts/ci/ios-app-launch.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-regressions:
    # Official runner inventory: macos-26 is arm64 and includes Xcode 26.6.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check that services stay in ServiceSet
        run: bash scripts/ci/check-ios-environment-keys.sh
      - name: Build package and app wrapper; run provider, lifecycle and command regressions
        env:
          IOS_CI_OUTPUT: ${{ runner.temp }}/ios-package-regressions
        run: bash scripts/ci/ios-package-regressions.sh
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-package-regressions/*.log
            ${{ runner.temp }}/ios-package-regressions/*.txt
            ${{ runner.temp }}/ios-package-regressions/*.json
            ${{ runner.temp }}/ios-package-regressions/Regressions.xcresult
          if-no-files-found: warn

  app-launch:
    # Launches the signed-out app wrapper on a fresh simulator. Needs no account, secret or test
    # backend: see scripts/ci/ios-app-launch.sh.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build the app wrapper, launch it and check it stays running
        env:
          IOS_CI_OUTPUT: ${{ runner.temp }}/ios-app-launch
        run: bash scripts/ci/ios-app-launch.sh
      - name: Upload build log and launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-app-launch/*.log
            ${{ runner.temp }}/ios-app-launch/*.txt
            ${{ runner.temp }}/ios-app-launch/*.png
          if-no-files-found: warn
