# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# bcprov 1.85 and later ship Java 25 class files that Jetifier cannot read. It holds no
# support-library references, so skip it (see the bcprov constraint in app/build.gradle.kts).
android.jetifier.ignorelist=bcprov-jdk18on
